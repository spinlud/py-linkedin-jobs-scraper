name: ci
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    # Only the offline unit tests run in CI. The live e2e suites (tests/test_programmatic.py and
    # tests/test_cli.py) drive the real site and authentication can be refused when run from CI,
    # so they are run locally before merging to master.
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Unit tests
        run: uv run pytest tests/unit --capture=no
        shell: bash

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Build distribution
        run: uv build

      # release/v1 is a moving ref onto the latest v1 of the action, which is how it is meant
      # to be pinned. __token__ is the default username, so only the token itself is passed.
      - name: Deploy to PyPi
        if: github.ref == 'refs/heads/master'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_DEPLOY_TOKEN }}
