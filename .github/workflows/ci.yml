name: ci
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    # Both live suites run sequentially on one runner so they never authenticate the same
    # account concurrently. Credentials try the remember me pair first and fall back to a bare
    # LI_AT_COOKIE; the pair lasts a year and renews itself, while a bare session cookie is
    # retired after roughly a hundred job loads and cannot renew.
    env:
      LI_RM_COOKIE: ${{ secrets.LI_RM_COOKIE }}
      LI_BCOOKIE: ${{ secrets.LI_BCOOKIE }}
      LI_AT_COOKIE: ${{ secrets.LI_AT_COOKIE }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The runner ships Chrome and Selenium Manager fetches a chromedriver matching it, so
      # there is no browser to install.
      - name: Test (programmatic)
        run: pytest tests/test_programmatic.py --capture=no --log-cli-level=INFO
        shell: bash

      # Runs regardless of the programmatic suite's outcome so both results are always reported.
      - name: Test (cli)
        if: always()
        run: pytest tests/test_cli.py --capture=no --log-cli-level=INFO
        shell: bash

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build distribution
        run: python setup.py install_egg_info sdist bdist_wheel

      # release/v1 is a moving ref onto the latest v1 of the action, which is how it is meant
      # to be pinned. __token__ is the default username, so only the token itself is passed.
      - name: Deploy to PyPi
        if: github.ref == 'refs/heads/master'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_DEPLOY_TOKEN }}
