name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `latest-known` is the newest uv whose checksum this setup-uv commit carries, so uv moves
      # only when the pin does.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known

      - run: npm run check

  # The offline suite only: the live ones need a LinkedIn session, and a throttled account must
  # never block a merge.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `python-version` sets UV_PYTHON, which takes precedence over the .python-version file.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          python-version: ${{ matrix.python-version }}

      - run: uv run --locked pytest tests/unit

  # The one required check. Without `always()` a failed dependency would skip this job, and a
  # skipped job counts as passed.
  ci:
    needs: [check, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS"
