[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-jobs-scraper"
version = "9.0.1"
description = "Scrape public available jobs on Linkedin using headless browser"
readme = "README.md"
authors = [{ name = "Ludovico Fabbri", email = "ludovico.fabbri@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["selenium>=4.51.0", "urllib3>=2.6.3"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/spinlud/py-linkedin-jobs-scraper.git"
Changelog = "https://github.com/spinlud/py-linkedin-jobs-scraper/blob/master/CHANGELOG.md"

[project.scripts]
linkedin-jobs-scraper = "linkedin_jobs_scraper.cli.main:main"
lijs = "linkedin_jobs_scraper.cli.main:main"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["linkedin_jobs_scraper"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "F", "E4", "E7", "E9",
    "BLE", "B", "TRY201",
    "RUF", "UP", "I", "PTH",
    "C4", "FURB", "SIM", "RET", "RSE", "PIE", "PLR1711", "PLR1714", "PLR1733",
    "PLC", "PLE", "PLW", "LOG",
    "ARG", "SLF", "T20", "PT", "ERA", "PGH",
    "C901", "TID251",
]
ignore = [
    "SIM105", # suggests contextlib.suppress, which BLE001 does not see
    "SIM108",
    "PT006",
]
unfixable = ["F401", "F841", "RUF100"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Narrow with a check instead."
"typing.no_type_check".msg = "Suppress one line, with a reason."
"typing_extensions.cast".msg = "Narrow with a check instead."
"typing_extensions.no_type_check".msg = "Suppress one line, with a reason."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SLF", "T20"]
"examples/**" = ["T20"]
"linkedin_jobs_scraper/cli/**" = ["T20"]
"linkedin_jobs_scraper/login.py" = ["T20"]

[tool.mypy]
python_version = "3.10"
files = ["linkedin_jobs_scraper", "tests", "examples"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool", "truthy-iterable", "exhaustive-match"]

[[tool.mypy.overrides]]
module = "tests.manual.*"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_any_explicit = false
disallow_subclassing_any = false
warn_return_any = false
warn_unreachable = false
